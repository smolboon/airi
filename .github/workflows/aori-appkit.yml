name: Aori AppKit

on:
  pull_request:
    paths:
      - "apps/aori-appkit/**"
      - ".github/workflows/aori-appkit.yml"
      - "docs/APPKIT_PORT.md"
      - "docs/AUDIT.md"
  push:
    branches:
      - main
    paths:
      - "apps/aori-appkit/**"
      - ".github/workflows/aori-appkit.yml"
      - "docs/APPKIT_PORT.md"
      - "docs/AUDIT.md"
  workflow_dispatch:

jobs:
  test-linux:
    name: Test core on Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/aori-appkit
    steps:
      - uses: actions/checkout@v6
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Install GPUI system libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libvulkan-dev libx11-dev libxcb1-dev libxcursor-dev libfontconfig1-dev libfreetype6-dev
      - name: Test
        run: swift test
      - name: Test the face library
        working-directory: apps/aori-appkit/rust
        run: cargo test -p aori-face
      - name: Check the GPUI window
        working-directory: apps/aori-appkit/rust
        run: cargo check -p aori-gpui

  build-and-test-macos:
    name: Build the AppKit target and test on macOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/aori-appkit
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
      - name: Test
        run: swift test
      - name: Test the face library
        working-directory: apps/aori-appkit/rust
        run: cargo test -p aori-face
      - name: Check the GPUI window
        working-directory: apps/aori-appkit/rust
        run: cargo check -p aori-gpui
      - name: Build the AppKit target
        run: ./scripts/build-app.sh
      - name: Assemble the app bundle
        run: ./scripts/assemble-app.sh

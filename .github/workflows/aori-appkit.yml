name: Aori AppKit

on:
  pull_request:
    paths:
      - "apps/aori-appkit/**"
      - ".github/workflows/aori-appkit.yml"
      - "docs/APPKIT_PORT.md"
      - "docs/AUDIT.md"
  push:
    branches:
      - main
    paths:
      - "apps/aori-appkit/**"
      - ".github/workflows/aori-appkit.yml"
      - "docs/APPKIT_PORT.md"
      - "docs/AUDIT.md"
  workflow_dispatch:

jobs:
  test-linux:
    name: Test core on Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/aori-appkit
    steps:
      - uses: actions/checkout@v6
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"
      - name: Test
        run: swift test

  build-and-test-macos:
    name: Build and test on macOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/aori-appkit
    steps:
      - uses: actions/checkout@v6
      - name: Test and compile the app
        run: swift test
      - name: Assemble the app bundle
        run: ./scripts/assemble-app.sh
